[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard-agent"
version = "0.1.0"
description = "ReleaseGuard Agent：契约冒烟测试与 LangGraph 最小调查 harness"
readme = "README.md"
requires-python = ">=3.11"
# 复用既有数据模型，通过 LangGraph 编排离线调查。
dependencies = [
  "pydantic>=2.10,<3",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
releaseguard-smoke = "releaseguard.smoke:main"
releaseguard-investigate = "releaseguard.harness:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 使 tests 无需预先 pip install -e 即可导入 src 下的包。
pythonpath = ["src"]
