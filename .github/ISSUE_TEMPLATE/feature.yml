name: 功能需求
description: 提议 Agent、平台、契约、事故场景或端到端集成功能。
title: "[功能]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: 所属区域
      options:
        - Agent
        - Platform
        - 契约
        - 事故场景
        - 端到端集成
        - 文档
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 负责人
      placeholder: "@Manticore0918、@adminxue 或双方"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 这项功能要解决什么工程问题或用户目标？
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 契约与依赖
      description: 列出相关 API 字段、Schema、提供方、消费方和阻塞任务。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 可观察的结果
        - [ ] 失败时的行为
        - [ ] 必须执行的测试
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全、回滚与清理
      description: 说明权限、影响范围、回滚和清理要求。
